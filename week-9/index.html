<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Supermarket Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .form-container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .form-container h2 {
            margin-top: 0;
        }

        input,
        select {
            padding: 10px;
            margin: 5px;
            width: 20%;
            min-width: 150px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #submitButton {
            background-color: #27ae60;
            color: white;
        }

        .clear-button {
            background-color: #7f8c8d;
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th,
        td {
            padding: 12px;
            text-align: center;
            border: 1px solid #ddd;
        }

        th {
            background-color: #34495e;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        td button:first-child {
            background-color: #3498db;
            color: white;
        }

        td button:last-child {
            background-color: #e74c3c;
            color: white;
        }

        @media (max-width: 700px) {
            input,
            select {
                width: 90%;
            }

            table {
                font-size: 12px;
            }

            .container {
                width: 95%;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Supermarket Management System</h1>
        <p>Single Page Application using RESTful APIs</p>
    </header>

    <div class="container">

        <!-- Product Form -->
        <div class="form-container">

            <h2>Product Management</h2>

            <input
                type="text"
                id="productName"
                placeholder="Product Name"
            >

            <select id="category">
                <option value="">Select Category</option>
                <option value="Groceries">Groceries</option>
                <option value="Dairy">Dairy</option>
                <option value="Snacks">Snacks</option>
                <option value="Beverages">Beverages</option>
                <option value="Fruits">Fruits</option>
                <option value="Vegetables">Vegetables</option>
            </select>

            <input
                type="number"
                id="price"
                placeholder="Price"
                min="0"
            >

            <input
                type="number"
                id="quantity"
                placeholder="Quantity"
                min="0"
            >

            <br>

            <button
                id="submitButton"
                onclick="handleSubmit()">
                Add Product
            </button>

            <button
                class="clear-button"
                onclick="clearForm()">
                Clear
            </button>

        </div>

        <!-- Product Table -->
        <h2>Available Products</h2>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Product Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="productTableBody">
            </tbody>

        </table>

    </div>

    <script src="app.js"></script>

</body>

</html>
